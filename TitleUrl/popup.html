<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图片字幕生成器</title>
    <style>
        body {
            width: 400px;
            padding: 10px;
            font-family: Arial, sans-serif;
        }
        .control-panel {
            margin-bottom: 20px;
        }
        .input-group {
            margin-bottom: 10px;
        }
        .preview-container {
            position: relative;
            margin-top: 20px;
        }
        #imagePreview {
            max-width: 100%;
            display: none;
        }
        textarea {
            width: 100%;
            height: 100px;
            margin: 10px 0;
        }
        .btn {
            background-color: #4CAF50;
            color: white;
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-right: 10px;
        }
        .btn:hover {
            background-color: #45a049;
        }
        canvas {
            max-width: 100%;
            border: 1px solid #ccc;
            display: block;
        }
    </style>
</head>
<body>
    <h2>图片字幕生成器</h2>
    
    <div class="control-panel">
        <div class="input-group">
            <input type="file" id="imageInput" accept="image/*">
        </div>

        <div class="input-group">
            <label>字幕高度(px): </label>
            <input type="number" id="subtitleHeight" value="40" style="width: 60px">
            
            <label>字体大小(px): </label>
            <input type="number" id="fontSize" value="20" style="width: 60px">
        </div>

        <div class="input-group">
            <label>字体颜色: </label>
            <input type="color" id="fontColor" value="#ffffff">
            
            <label>轮廓颜色: </label>
            <input type="color" id="strokeColor" value="#000000">
        </div>

        <div class="input-group">
            <textarea id="subtitleText" placeholder="请输入字幕文本，每行将单独显示"></textarea>
        </div>

        <button class="btn" onclick="generateSubtitle()">生成字幕</button>
        <button class="btn" onclick="saveImage()">保存图片</button>
    </div>

    <div class="preview-container">
        <canvas id="canvas"></canvas>
    </div>

    <script src="popup.js"></script>
</body>
</html>
